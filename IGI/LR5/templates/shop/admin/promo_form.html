{% extends 'shop/base.html' %}

{% block title %}{{ title }} - Sweet Dreams{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">{{ title }}</h2>
                    
                    {% if messages %}
                    <div class="messages mb-4">
                        {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="code" class="form-label">Код промокода*</label>
                            <input type="text" class="form-control" id="code" name="code" 
                                   value="{{ promo.code|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="discount_percent" class="form-label">Процент скидки*</label>
                            <input type="number" class="form-control" id="discount_percent" name="discount_percent" 
                                   value="{{ promo.discount_percent|default:'' }}" min="0" max="100" step="0.1" required>
                        </div>
                        <div class="mb-3">
                            <label for="valid_from" class="form-label">Действует с</label>
                            <input type="datetime-local" class="form-control" id="valid_from" name="valid_from" 
                                   value="{{ promo.valid_from|date:'Y-m-d\TH:i'|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="valid_to" class="form-label">Действует по</label>
                            <input type="datetime-local" class="form-control" id="valid_to" name="valid_to" 
                                   value="{{ promo.valid_to|date:'Y-m-d\TH:i'|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="3">{{ promo.description|default:'' }}</textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" 
                                   {% if promo.is_active|default:True %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Активен</label>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'shop:admin_promo_list' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Назад к списку
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
